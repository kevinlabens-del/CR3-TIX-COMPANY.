<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<meta name="description" content="CR3@TIX COMPANY — entreprise virtuelle et cockpit du Boss.">
<link rel="manifest" href="manifest.json">
<title>CR3@TIX COMPANY</title>
<style>
:root{--bg:#05060b;--panel:#0d1019;--panel2:#121726;--text:#eef2ff;--muted:#8d97b3;--line:#21283b;--cyan:#24d6ff;--violet:#8f5cff;--green:#6cf0a8;--amber:#ffca62;--red:#ff6d86}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{background-image:radial-gradient(circle at 20% 0,rgba(36,214,255,.10),transparent 25%),radial-gradient(circle at 90% 10%,rgba(143,92,255,.13),transparent 28%)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.gate{position:fixed;inset:0;z-index:999;background:#05060b;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);border:1px solid #26304a;border-radius:22px;padding:28px;background:linear-gradient(180deg,#111625,#090c14);box-shadow:0 30px 90px #000}.logo{width:72px;height:72px;border-radius:20px;border:1px solid rgba(36,214,255,.5);display:grid;place-items:center;font-weight:900;font-size:1.5rem;background:linear-gradient(135deg,rgba(36,214,255,.15),rgba(143,92,255,.18))}.eyebrow{color:var(--muted);font-size:.72rem;letter-spacing:.2em}.muted{color:var(--muted)}.login h1{margin:8px 0}.input,.textarea,.select{width:100%;background:#080b12;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}.textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--line);background:#111625;color:var(--text);padding:10px 14px;border-radius:11px;cursor:pointer}.btn.primary{background:linear-gradient(90deg,rgba(36,214,255,.18),rgba(143,92,255,.2));border-color:rgba(36,214,255,.4)}.btn.ok{color:var(--green);border-color:rgba(108,240,168,.35)}.btn.danger{color:var(--red);border-color:rgba(255,109,134,.35)}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:20px;background:rgba(7,9,16,.96);position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.brand .logo{width:46px;height:46px;border-radius:14px;font-size:1rem}.brand strong,.brand span{display:block}.brand span{color:var(--muted);font-size:.75rem;letter-spacing:.24em}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:12px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{color:var(--text);background:linear-gradient(90deg,rgba(36,214,255,.12),rgba(143,92,255,.08))}.main{min-width:0}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line);background:rgba(5,6,11,.88);backdrop-filter:blur(12px)}.top h1{font-size:1.25rem;margin:2px 0}.lock{margin-left:auto}.view{padding:24px;max-width:1450px;margin:auto}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.card{background:linear-gradient(180deg,rgba(18,23,38,.96),rgba(10,13,21,.96));border:1px solid var(--line);border-radius:18px;padding:18px}.glow{border-color:rgba(36,214,255,.28)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.kpi{border:1px solid var(--line);border-radius:15px;padding:15px;background:rgba(255,255,255,.02)}.kpi b{font-size:1.6rem;display:block}.kpi span{color:var(--muted);font-size:.82rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;background:rgba(255,255,255,.018)}.meta{color:var(--muted);font-size:.8rem;margin-top:5px}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:.7rem;color:var(--muted)}.badge.wait{color:var(--amber)}.badge.active{color:var(--green)}.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.project{border:1px solid var(--line);border-radius:15px;padding:15px;background:rgba(255,255,255,.02)}.project h3{margin:8px 0}.employee{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.avatar{width:54px;height:54px;border-radius:15px;border:1px solid var(--line);display:grid;place-items:center;font-size:1.5rem}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:grid;place-items:center;padding:20px}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#0b0f19;border:1px solid #2b3449;border-radius:18px;padding:20px}.loginmsg{min-height:24px;margin-top:10px;color:var(--red)}#menu{display:none}.footer{color:#596179;font-size:.76rem;position:absolute;bottom:18px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:250px;z-index:100;transition:.2s}.side.open{left:0}.top{padding:15px}.view{padding:15px}.hero,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}#menu{display:block}.employee{grid-template-columns:50px 1fr}.employee .badge{grid-column:2}}
</style>
</head>
<body>
<section id="gate" class="gate"><div class="login"><div class="logo">C3</div><div class="eyebrow" style="margin-top:18px">CR3@TIX COMPANY</div><h1>Accès Boss</h1><p class="muted">Entreprise personnelle — entre ton code pour ouvrir le cockpit.</p><form id="login"><input id="code" class="input" type="password" placeholder="Code d’accès" autocomplete="current-password" required><button class="btn primary" style="width:100%;margin-top:12px">🔐 Entrer dans l’entreprise</button></form><div id="loginmsg" class="loginmsg"></div><div class="meta">Protection locale adaptée à cette première version GitHub Pages.</div></div></section>
<div class="shell"><aside id="side" class="side"><div class="brand"><div class="logo">C3</div><div><strong>CR3@TIX</strong><span>COMPANY</span></div></div><nav id="nav" class="nav"><button class="active" data-v="dashboard">🏢 Entreprise</button><button data-v="boss">👑 Bureau du Boss</button><button data-v="pm">🧠 Chef de projet</button><button data-v="projects">🧩 Projets</button><button data-v="employees">👥 Employés</button><button data-v="decisions">✅ Décisions</button><button data-v="history">📚 Historique</button></nav><div class="footer">V0.2 — Fondation évolutive</div></aside><main class="main"><header class="top"><button id="menu" class="btn">☰</button><div><div class="eyebrow">CR3@TIX COMPANY</div><h1 id="title">Entreprise</h1></div><button id="lock" class="btn lock">🔒 Verrouiller</button></header><section id="view" class="view"></section></main></div>
<div id="modal" class="modal hidden"><div id="modalbox" class="modalbox"></div></div>
<script>
const KEY='cr3atix_company_v02_live',AUTH='cr3atix_company_auth';const HASH='6caf3e3224b26050198ca1f461c1d6b2f56436e116efcb1218cb3e3746b1d8f9';const now=()=>new Date().toISOString();const uid=p=>p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
const seed={company:{name:'CR3@TIX COMPANY',boss:'Kev',phase:'Fondation',mission:'Construire une entreprise virtuelle capable de structurer, développer et faire évoluer les projets CR3@TIX.'},employees:[{id:'EMP-0000',name:'Kev',role:'Boss / Dirigeant',dept:'Direction',manager:null,status:'active',icon:'👑',skills:['Vision','Décision finale','Validation']},{id:'EMP-0001',name:'EMP-001',role:'Chef de projet CR3@TIX',dept:'Direction & Opérations',manager:'EMP-0000',status:'active',icon:'🧠',skills:['Analyse projet','Planification','Structuration','Priorisation','Proposition de recrutements']}],projects:[{id:uid('PRJ'),name:'NYXEL',type:'Android / IA',status:'développement',priority:'haute',progress:28,summary:'Assistant personnel Android et moteur vocal.'},{id:uid('PRJ'),name:'CR3@TIX BRAIN',type:'IA / Outil',status:'conception',priority:'haute',progress:18,summary:'Mémoire centrale et espace de travail des projets.'},{id:uid('PRJ'),name:'CR3@TIX PONG',type:'Jeu',status:'actif',priority:'moyenne',progress:62,summary:'Jeu Pong évolutif avec campagne et arènes.'},{id:uid('PRJ'),name:'CR3@TIX STORAGE',type:'Android / Outil',status:'conception',priority:'moyenne',progress:12,summary:'Gestionnaire de fichiers et synchronisation multi-sources.'},{id:uid('PRJ'),name:'CR3@TIX AI LIVE',type:'Web / Vidéo',status:'en ligne',priority:'moyenne',progress:70,summary:'Plateforme de conférences IA intégrées.'}],tasks:[{id:uid('TSK'),title:'Établir la cartographie complète de CR3@TIX',status:'in_progress',owner:'EMP-0001',priority:'haute'},{id:uid('TSK'),title:'Identifier les prochains postes nécessaires',status:'todo',owner:'EMP-0001',priority:'haute'}],decisions:[{id:uid('DEC'),title:'Premier recrutement technique',detail:'EMP-001 recommande un Architecte logiciel / Lead Developer polyvalent.',status:'pending',impact:'haute',createdAt:now()}],proposals:[],activity:[{id:uid('ACT'),text:'CR3@TIX COMPANY initialisée. Boss et EMP-001 actifs.',createdAt:now()}]};
let state=load(),page='dashboard';function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function log(t){state.activity.unshift({id:uid('ACT'),text:t,createdAt:now()});state.activity=state.activity.slice(0,200);save()}function fmt(x){return new Date(x).toLocaleString('fr-FR')}
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}document.getElementById('login').onsubmit=async e=>{e.preventDefault();const v=document.getElementById('code').value;if(await sha(v)===HASH){sessionStorage.setItem(AUTH,'1');document.getElementById('gate').classList.add('hidden');document.getElementById('code').value=''}else document.getElementById('loginmsg').textContent='Code incorrect.'};document.getElementById('lock').onclick=()=>{sessionStorage.removeItem(AUTH);document.getElementById('gate').classList.remove('hidden')};if(sessionStorage.getItem(AUTH)==='1')document.getElementById('gate').classList.add('hidden');
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{page=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('side').classList.remove('open');render()});document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');
const titles={dashboard:'Entreprise',boss:'Bureau du Boss',pm:'Chef de projet',projects:'Projets',employees:'Employés',decisions:'Décisions',history:'Historique'};function render(){document.getElementById('title').textContent=titles[page];({dashboard, boss, pm, projects, employees, decisions, history}[page])()}
function dashboard(){const p=state.decisions.filter(x=>x.status==='pending').length,t=state.tasks.filter(x=>x.status!=='done').length;view.innerHTML=`<div class="hero"><div class="card glow"><div class="eyebrow">PHASE ${esc(state.company.phase).toUpperCase()}</div><h2>Entreprise virtuelle CR3@TIX</h2><p class="muted">${esc(state.company.mission)}</p><div class="toolbar"><button class="btn primary" onclick="analyze()">🧠 Lancer l’analyse EMP-001</button><button class="btn" onclick="idea()">💡 Donner une idée</button></div></div><div class="card"><div style="font-size:2.5rem">👑</div><div class="eyebrow">DIRECTION</div><h2>${esc(state.company.boss)}</h2><span class="badge active">Boss — autorité finale</span></div></div><div class="kpis"><div class="kpi"><b>${state.projects.length}</b><span>Projets</span></div><div class="kpi"><b>${state.employees.length}</b><span>Employés</span></div><div class="kpi"><b>${t}</b><span>Travaux ouverts</span></div><div class="kpi"><b>${p}</b><span>Décisions Boss</span></div></div><div class="grid2"><div class="card"><div class="section"><h3>Décisions</h3><span class="badge wait">${p}</span></div>${decisionList(false)}</div><div class="card"><div class="section"><h3>Activité récente</h3></div>${activityList(6)}</div></div>`}
function boss(){view.innerHTML=`<div class="card glow"><div class="eyebrow">BUREAU PRIVÉ</div><h2>👑 Boss — ${esc(state.company.boss)}</h2><p class="muted">Tu donnes les idées, orientations et validations. EMP-001 organise le reste de l’entreprise.</p><div class="toolbar"><button class="btn primary" onclick="idea()">💡 Nouvelle idée</button><button class="btn" onclick="analyze()">🧠 Demander une analyse</button></div></div><div class="card" style="margin-top:16px"><h3>Décisions à prendre</h3>${decisionList(false)}</div>`}
function pm(){const e=state.employees.find(x=>x.id==='EMP-0001');view.innerHTML=`<div class="card glow"><div class="employee"><div class="avatar">${e.icon}</div><div><div class="eyebrow">${e.id}</div><h2 style="margin:4px 0">${e.role}</h2><div class="muted">${e.dept}</div></div><span class="badge active">ACTIF</span></div><p class="muted">Premier employé de confiance. Il analyse, structure, priorise et prépare les futurs recrutements de l’entreprise.</p><div class="toolbar"><button class="btn primary" onclick="analyze()">Analyser l’entreprise</button><button class="btn" onclick="idea()">Nouvelle mission</button></div></div><div class="grid2" style="margin-top:16px"><div class="card"><h3>Travaux confiés</h3>${taskList()}</div><div class="card"><h3>Propositions</h3>${proposalList()}</div></div>`}
function projects(){view.innerHTML=`<div class="section"><div><h2>Projets CR3@TIX</h2><div class="muted">Base de connaissance initiale de l’entreprise.</div></div><button class="btn primary" onclick="addProject()">+ Ajouter</button></div><div class="projects">${state.projects.map(p=>`<div class="project"><div class="eyebrow">${esc(p.type)}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.summary)}</p><span class="badge">${esc(p.status)} · ${p.progress}%</span></div>`).join('')}</div>`}
function employees(){view.innerHTML=`<div class="section"><div><h2>Organigramme</h2><div class="muted">Les nouveaux postes seront ajoutés au fur et à mesure des besoins réels.</div></div></div><div class="list">${state.employees.map(e=>`<div class="item employee"><div class="avatar">${e.icon}</div><div><strong>${e.name}</strong><div>${e.role}</div><div class="meta">${e.dept} · ${esc(e.skills.join(' · '))}</div></div><span class="badge active">${e.status}</span></div>`).join('')}</div>`}
function decisions(){view.innerHTML=`<h2>Décisions de direction</h2>${decisionList(true)}`}
function history(){view.innerHTML=`<h2>Historique</h2>${activityList(100)}`}
function taskList(){return `<div class="list">${state.tasks.map(t=>`<div class="item"><strong>${esc(t.title)}</strong><div class="meta">${t.owner} · ${t.priority} · ${t.status}</div></div>`).join('')}</div>`}function decisionList(all){const a=all?state.decisions:state.decisions.filter(d=>d.status==='pending');if(!a.length)return'<div class="item muted">Aucune décision en attente.</div>';return `<div class="list">${a.map(d=>`<div class="item"><strong>${esc(d.title)}</strong><p class="muted">${esc(d.detail)}</p><div class="meta">Impact ${d.impact} · ${fmt(d.createdAt)}</div>${d.status==='pending'?`<div class="toolbar"><button class="btn ok" onclick="decide('${d.id}','approved')">Valider</button><button class="btn danger" onclick="decide('${d.id}','rejected')">Refuser</button></div>`:`<span class="badge">${d.status}</span>`}</div>`).join('')}</div>`}function activityList(n){return `<div class="list">${state.activity.slice(0,n).map(a=>`<div class="item"><strong>${esc(a.text)}</strong><div class="meta">${fmt(a.createdAt)}</div></div>`).join('')}</div>`}function proposalList(){if(!state.proposals.length)return'<div class="item muted">Aucune proposition. Lance une analyse.</div>';return `<div class="list">${state.proposals.map(p=>`<div class="item"><strong>${esc(p.title)}</strong><div class="meta">${esc(p.detail)}</div></div>`).join('')}</div>`}
function decide(id,s){const d=state.decisions.find(x=>x.id===id);if(!d)return;d.status=s;log(`Décision « ${d.title} » : ${s==='approved'?'VALIDÉE':'REFUSÉE'} par le Boss.`);save();render()}function analyze(){const f=[];const high=state.projects.filter(p=>p.priority==='haute'&&p.progress<50);if(high.length)f.push({title:'Priorités élevées à revoir',detail:high.map(p=>p.name).join(', ')});if(!state.employees.some(e=>/Architecte|Lead Developer/i.test(e.role)))f.push({title:'Recrutement prioritaire',detail:'Architecte logiciel / Lead Developer nécessaire pour transformer les décisions en architecture technique.'});if(!state.employees.some(e=>/QA|Test/i.test(e.role)))f.push({title:'Recrutement futur',detail:'QA Engineer nécessaire avant les premières modifications automatiques de code.'});state.proposals=f;if(!state.decisions.some(d=>d.status==='pending'&&/EMP-002/.test(d.title)))state.decisions.unshift({id:uid('DEC'),title:'Autoriser le recrutement EMP-002',detail:'Poste proposé : Architecte logiciel / Lead Developer.',status:'pending',impact:'haute',createdAt:now()});log(`EMP-001 a analysé ${state.projects.length} projets et généré ${f.length} proposition(s).`);save();render()}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};function idea(){modal(`<h2>💡 Nouvelle idée du Boss</h2><textarea id="ideaText" class="textarea" placeholder="Décris l’idée, l’amélioration ou l’objectif..."></textarea><div class="toolbar"><button class="btn primary" onclick="submitIdea()">Transmettre à EMP-001</button><button class="btn" onclick="closeModal()">Annuler</button></div>`)}function submitIdea(){const t=document.getElementById('ideaText').value.trim();if(!t)return;state.tasks.unshift({id:uid('TSK'),title:t,status:'todo',owner:'EMP-0001',priority:'haute'});log('Nouvelle instruction du Boss transmise à EMP-001 : '+t);save();closeModal();render()}function addProject(){modal(`<h2>Ajouter un projet</h2><input id="pn" class="input" placeholder="Nom"><input id="pt" class="input" style="margin-top:10px" placeholder="Type"><textarea id="ps" class="textarea" style="margin-top:10px" placeholder="Résumé"></textarea><div class="toolbar"><button class="btn primary" onclick="saveProject()">Ajouter</button><button class="btn" onclick="closeModal()">Annuler</button></div>`)}function saveProject(){const n=document.getElementById('pn').value.trim();if(!n)return;state.projects.unshift({id:uid('PRJ'),name:n,type:document.getElementById('pt').value||'Projet',status:'nouveau',priority:'moyenne',progress:0,summary:document.getElementById('ps').value});log('Projet ajouté : '+n);save();closeModal();render()}function closeModal(){document.getElementById('modal').classList.add('hidden')}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script>
</body></html>
