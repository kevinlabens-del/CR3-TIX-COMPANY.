<style>
:root{--bg:#05070d;--bg2:#080b13;--panel:#0d111c;--panel2:#111827;--line:#1f2a3d;--line2:#2b3952;--text:#f4f7ff;--muted:#8e9ab5;--cyan:#24d6ff;--violet:#9167ff;--green:#67e8a5;--amber:#ffd166;--red:#ff708a;--shadow:0 18px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{background-image:radial-gradient(circle at 15% 0,rgba(36,214,255,.09),transparent 24%),radial-gradient(circle at 92% 10%,rgba(145,103,255,.11),transparent 28%),linear-gradient(180deg,#05070d,#060810 55%,#05070d)}button,input,textarea{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#7f8cab}.shell{display:grid;grid-template-columns:275px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(5,8,14,.94);backdrop-filter:blur(18px);z-index:60}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(36,214,255,.38);background:linear-gradient(145deg,rgba(36,214,255,.12),rgba(145,103,255,.18));box-shadow:inset 0 0 28px rgba(36,214,255,.05),0 0 28px rgba(36,214,255,.06);font-weight:900}.brand strong{display:block;font-size:1rem}.brand small{display:block;color:var(--muted);letter-spacing:.22em;margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#8b96b0;padding:12px 13px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,rgba(36,214,255,.12),rgba(145,103,255,.08));box-shadow:inset 1px 0 0 rgba(36,214,255,.55)}.sidefoot{position:absolute;bottom:18px;left:24px;right:24px;color:#68738c;font-size:.74rem}.main{min-width:0}.top{position:sticky;top:0;z-index:50;height:74px;display:flex;align-items:center;gap:14px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(5,7,13,.84);backdrop-filter:blur(18px)}.top h1{margin:1px 0 0;font-size:1.16rem}.statusdot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.topright{margin-left:auto;display:flex;align-items:center;gap:10px}.btn{border:1px solid var(--line2);background:#0d1420;color:var(--text);padding:10px 13px;border-radius:11px;cursor:pointer}.btn:hover{border-color:#40516e}.btn.primary{border-color:rgba(36,214,255,.42);background:linear-gradient(90deg,rgba(36,214,255,.16),rgba(145,103,255,.18))}.btn.danger{color:var(--red);border-color:rgba(255,112,138,.28)}#menu{display:none}.view{padding:24px;max-width:1550px;margin:auto}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,24,39,.88),rgba(10,14,23,.94));border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card.glow{border-color:rgba(36,214,255,.28);box-shadow:0 20px 70px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.02)}.headline{font-size:clamp(1.7rem,3vw,3rem);line-height:1.03;margin:8px 0 10px;letter-spacing:-.04em}.headline span{background:linear-gradient(90deg,var(--cyan),#b59cff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:760px}.commandbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.bossbox{display:grid;align-content:space-between;min-height:235px}.bossicon{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:linear-gradient(145deg,rgba(255,209,102,.12),rgba(145,103,255,.1));border:1px solid rgba(255,209,102,.25)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.kpi{padding:16px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.018)}.kpi b{display:block;font-size:1.75rem;letter-spacing:-.03em}.kpi span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section h2,.section h3{margin:0}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line2);font-size:.72rem;color:var(--muted)}.badge.ok{color:var(--green);border-color:rgba(103,232,165,.25)}.badge.warn{color:var(--amber);border-color:rgba(255,209,102,.25)}.badge.info{color:var(--cyan);border-color:rgba(36,214,255,.25)}.badge.err{color:var(--red);border-color:rgba(255,112,138,.25)}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.014)}.rowmain{min-width:0;flex:1}.rowmain strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowmain small{color:var(--muted)}.empavatar{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--line2);background:#0c1320;font-size:1.2rem}.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.project{border:1px solid var(--line);border-radius:15px;padding:15px;background:rgba(255,255,255,.018)}.project h3{margin:10px 0 6px;font-size:1rem}.project p{font-size:.84rem;color:var(--muted);min-height:38px}.meter{height:6px;background:#111827;border-radius:999px;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:999px}.task{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task small{color:var(--muted)}.empty{padding:24px;border:1px dashed var(--line2);border-radius:13px;color:var(--muted);text-align:center}.gate{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 25%,rgba(36,214,255,.08),transparent 30%),#05070d;display:grid;place-items:center;padding:20px}.login{width:min(460px,100%);padding:30px;border:1px solid #26334a;border-radius:24px;background:linear-gradient(180deg,#101624,#080c14);box-shadow:0 35px 100px rgba(0,0,0,.6)}.login .mark{width:68px;height:68px;border-radius:20px;font-size:1.25rem}.login h1{font-size:2rem;margin:15px 0 8px}.input,.textarea{width:100%;border:1px solid var(--line2);background:#070b12;color:#fff;border-radius:12px;padding:12px}.textarea{min-height:125px;resize:vertical}.formgrid{display:grid;gap:10px}.modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.74);display:grid;place-items:center;padding:20px}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line2);border-radius:18px;background:#0a0f18;padding:20px}.notice{padding:11px 13px;border-radius:12px;border:1px solid rgba(36,214,255,.2);background:rgba(36,214,255,.05);color:#b9eefa;font-size:.84rem}.legend{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:.72rem;padding:5px 8px;border-radius:8px;background:#0d1420;color:#93a0ba}.footnote{color:#66728a;font-size:.76rem;margin-top:10px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-285px;width:275px;transition:.22s}.side.open{left:0}.top{padding:0 15px}.view{padding:15px}.hero,.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}#menu{display:inline-flex}.topright .syncText{display:none}}@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}.headline{font-size:2rem}.topright .btn:not(.danger){display:none}}
</style>
</head>
<body>
<section id="gate" class="gate"><div class="login"><div class="mark">C3</div><div class="eyebrow" style="margin-top:18px">CR3@TIX COMPANY</div><h1>Boss Access</h1><p class="muted">Cockpit privé de direction. Entre ton code d’accès pour ouvrir l’entreprise.</p><form id="login" class="formgrid"><input id="code" class="input" type="password" placeholder="Code d’accès" autocomplete="current-password" required><button class="btn primary">🔐 Ouvrir le cockpit</button></form><div id="loginmsg" style="min-height:24px;color:var(--red);margin-top:10px"></div><div class="footnote">Protection d’accès de la version GitHub Pages.</div></div></section>
<div class="shell"><aside id="side" class="side"><div class="brand"><div class="mark">C3</div><div><strong>CR3@TIX COMPANY</strong><small>COMMAND CENTER</small></div></div><nav id="nav" class="nav"><button class="active" data-v="dashboard">🏢 <span>Vue entreprise</span></button><button data-v="boss">👑 <span>Bureau du Boss</span></button><button data-v="pm">🧠 <span>Chef de projet</span></button><button data-v="projects">🧩 <span>Portefeuille projets</span></button><button data-v="employees">👥 <span>Employés-programmes</span></button><button data-v="tasks">⚙️ <span>Travaux automatiques</span></button><button data-v="decisions">✅ <span>Validations Boss</span></button><button data-v="system">🛡️ <span>Système & autonomie</span></button></nav><div class="sidefoot"><div>COMPANY CORE v0.4</div><div id="sideStatus">Initialisation…</div></div></aside><main class="main"><header class="top"><button id="menu" class="btn">☰</button><div class="statusdot"></div><div><div class="eyebrow">CR3@TIX COMPANY</div><h1 id="title">Vue entreprise</h1></div><div class="topright"><span class="muted syncText" id="syncText">Connexion au COMPANY CORE…</span><button id="refresh" class="btn">↻ Actualiser</button><button id="lock" class="btn danger">🔒</button></div></header><section id="view" class="view"></section></main></div>
<div id="modal" class="modal hidden"><div id="modalbox" class="modalbox"></div></div>
<script>
const HASH='6caf3e3224b26050198ca1f461c1d6b2f56436e116efcb1218cb3e3746b1d8f9',AUTH='cr3atix_company_auth';
const view=document.getElementById('view'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
let page='dashboard',core={state:null,projects:[],queue:[],loaded:false,error:null};
const employees=[
{id:'EMP-001',name:'Chef de projet CR3@TIX',role:'Orchestrateur général',icon:'🧠',manager:'Boss',mission:'Analyse le portefeuille, priorise, découpe et distribue le travail.'},
{id:'EMP-002',name:'Architecte logiciel',role:'Architecture / Lead',icon:'🏗️',manager:'EMP-001',mission:'Inspecte les projets et prépare les plans techniques.'},
{id:'EMP-003',name:'Développeur polyvalent',role:'Développement',icon:'💻',manager:'EMP-002',mission:'Implémente, corrige, compile et prépare les changements.'},
{id:'EMP-004',name:'QA Engineer',role:'Qualité & tests',icon:'🧪',manager:'EMP-001',mission:'Teste, contrôle les régressions et accepte ou rejette un candidat.'},
{id:'EMP-005',name:'DevOps / Release Engineer',role:'Build & livraison',icon:'🚀',manager:'EMP-001',mission:'Prépare les artefacts, previews et versions prêtes à livrer.'}
];
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
$('#login').onsubmit=async e=>{e.preventDefault();if(await sha($('#code').value)===HASH){sessionStorage.setItem(AUTH,'1');$('#gate').classList.add('hidden');$('#code').value='';loadCore()}else $('#loginmsg').textContent='Code incorrect.'};
$('#lock').onclick=()=>{sessionStorage.removeItem(AUTH);$('#gate').classList.remove('hidden')};if(sessionStorage.getItem(AUTH)==='1'){$('#gate').classList.add('hidden');loadCore()}
$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#refresh').onclick=()=>loadCore(true);
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{page=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x===b));$('#side').classList.remove('open');render()});
const titles={dashboard:'Vue entreprise',boss:'Bureau du Boss',pm:'Chef de projet',projects:'Portefeuille projets',employees:'Employés-programmes',tasks:'Travaux automatiques',decisions:'Validations Boss',system:'Système & autonomie'};
async function loadJson(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return r.json()}
async function loadCore(manual=false){$('#syncText').textContent='Synchronisation…';try{const [state,projects,queue]=await Promise.all([loadJson('company-data/company-state.json'),loadJson('company-data/projects.json'),loadJson('company-data/work-queue.json')]);core={state,projects:Array.isArray(projects)?projects:(projects.projects||[]),queue:Array.isArray(queue)?queue:(queue.tasks||queue.queue||[]),loaded:true,error:null};$('#syncText').textContent='COMPANY CORE synchronisé';$('#sideStatus').textContent='● Autonomie active';render()}catch(e){core.error=e.message;core.loaded=true;$('#syncText').textContent='Données locales indisponibles';$('#sideStatus').textContent='● Interface active';render()} }
function render(){document.getElementById('title').textContent=titles[page];({dashboard,boss,pm,projects,employees,tasks,decisions,system}[page]||dashboard)()}
function s(){return core.state||{projectCount:0,openAutomaticTasks:0,employeesActive:[],cycle:{status:'initializing'},analyses:[]}}
function queueItems(){return core.queue||[]}
function projectItems(){return core.projects||[]}
function badge(txt,type='info'){return `<span class="badge ${type}">${esc(txt)}</span>`}
function dashboard(){const st=s(),q=queueItems(),projects=projectItems();const active=st.employeesActive?.length||employees.length;view.innerHTML=`<div class="hero"><div class="card glow"><div class="eyebrow">CENTRE DE COMMANDE AUTONOME</div><div class="headline">La tête opérationnelle de <span>CR3@TIX</span></div><p class="muted">COMPANY observe les projets, prépare le travail, coordonne les employés-programmes et remonte au Boss les décisions qui nécessitent son autorité.</p><div class="commandbar"><button class="btn primary" onclick="openOrder()">👑 Donner un ordre</button><button class="btn" onclick="go('tasks')">⚙️ Voir les travaux</button><button class="btn" onclick="go('projects')">🧩 Ouvrir le portefeuille</button></div></div><div class="card bossbox"><div><div class="bossicon">👑</div><div class="eyebrow" style="margin-top:15px">DIRECTION GÉNÉRALE</div><h2 style="margin:5px 0">Kev — Boss</h2><p class="muted">Vision, arbitrage et validation finale.</p></div>${badge('Autorité finale','warn')}</div></div><div class="kpis"><div class="kpi"><b>${st.projectCount||projects.length}</b><span>projets détectés</span></div><div class="kpi"><b>${st.openAutomaticTasks||q.length}</b><span>travaux automatiques</span></div><div class="kpi"><b>${active}</b><span>employés actifs</span></div><div class="kpi"><b>${st.cycle?.status==='success'?'OK':'—'}</b><span>dernier cycle</span></div><div class="kpi"><b>6h</b><span>cadence d’analyse</span></div></div><div class="grid2"><div class="card"><div class="section"><h3>🧠 EMP-001 — situation actuelle</h3>${badge(st.cycle?.status==='success'?'Opérationnel':'Initialisation',st.cycle?.status==='success'?'ok':'warn')}</div><p class="muted">${esc(st.cycle?.nextAction||'Analyse du portefeuille et préparation du travail.')}</p><div class="notice">Le Boss reste la porte finale pour les publications, suppressions, recrutements et opérations à fort impact.</div></div><div class="card"><div class="section"><h3>⚙️ Travaux prioritaires</h3>${badge((st.openAutomaticTasks||q.length)+' ouverts','info')}</div>${taskList(q.slice(0,5))}</div></div>`}
function boss(){view.innerHTML=`<div class="grid2"><div class="card glow"><div class="eyebrow">BUREAU DE DIRECTION</div><h2>👑 Poste de commandement du Boss</h2><p class="muted">Tu définis ce que l'entreprise doit accomplir. COMPANY doit ensuite organiser le travail et te présenter un résultat prêt à être accepté ou refusé.</p><div class="commandbar"><button class="btn primary" onclick="openOrder()">＋ Nouvel ordre stratégique</button><button class="btn" onclick="go('decisions')">✅ Résultats à valider</button></div></div><div class="card"><h3>Ce qui doit arriver jusqu'à toi</h3><div class="list"><div class="row"><div class="empavatar">📦</div><div class="rowmain"><strong>Livraison finale</strong><small>APK, version web, correctif ou artefact vérifié.</small></div></div><div class="row"><div class="empavatar">⚠️</div><div class="rowmain"><strong>Décision à fort impact</strong><small>Publication, suppression, recrutement, coût, sécurité.</small></div></div><div class="row"><div class="empavatar">📊</div><div class="rowmain"><strong>Synthèse claire</strong><small>Ce qui a été fait, testé et ce qui reste éventuel.</small></div></div></div></div></div>`}
function pm(){const st=s();view.innerHTML=`<div class="card glow"><div class="section"><div><div class="eyebrow">EMP-001</div><h2 style="margin:5px 0">🧠 Chef de projet CR3@TIX</h2></div>${badge('Autonomie élevée','ok')}</div><p class="muted">EMP-001 est le responsable opérationnel : inventaire des projets, analyse de santé, priorisation, découpage des objectifs, délégation, suivi des blocages et synthèse finale.</p></div><div class="kpis"><div class="kpi"><b>${st.projectCount||0}</b><span>projets sous surveillance</span></div><div class="kpi"><b>${st.openAutomaticTasks||0}</b><span>travaux créés</span></div><div class="kpi"><b>${employees.length-1}</b><span>spécialistes coordonnés</span></div><div class="kpi"><b>${st.cycle?.status==='success'?'Actif':'—'}</b><span>état du cycle</span></div><div class="kpi"><b>Boss</b><span>escalade finale</span></div></div><div class="card"><div class="section"><h3>Dernières analyses</h3></div>${analysisList((st.analyses||[]).slice(0,10))}</div>`}
function projects(){const arr=projectItems(),fallback=(s().analyses||[]).map(a=>({name:a.project,status:'analysé',priority:'medium',metadata:{findings:a.findings},score:a.score}));const list=arr.length?arr:fallback;view.innerHTML=`<div class="section"><div><div class="eyebrow">PORTEFEUILLE CENTRAL</div><h2>Projets connus de COMPANY</h2></div>${badge(list.length+' entrées','info')}</div><div class="projects">${list.map((p,i)=>{const score=p.score??Math.max(20,80-(i%5)*10),find=(p.metadata?.findings||p.findings||[])[0]||'Suivi par COMPANY CORE.';return `<div class="project"><div class="legend">${badge(p.status||'détecté','info')} ${p.source?badge(p.source,''):''}</div><h3>${esc(p.name||p.project||'Projet')}</h3><p>${esc(find)}</p><div class="meter"><i style="width:${Math.min(100,Math.max(5,score))}%"></i></div><div class="footnote">Indice de suivi : ${score}/100</div></div>`}).join('')}</div>`}
function employeesPage(){view.innerHTML=`<div class="section"><div><div class="eyebrow">FORCE DE TRAVAIL NUMÉRIQUE</div><h2>Employés-programmes</h2></div>${badge(employees.length+' actifs','ok')}</div><div class="grid3">${employees.map(e=>`<div class="card"><div class="row" style="border:0;padding:0;background:transparent"><div class="empavatar">${e.icon}</div><div class="rowmain"><strong>${esc(e.id)} — ${esc(e.name)}</strong><small>${esc(e.role)}</small></div>${badge('Actif','ok')}</div><p class="muted">${esc(e.mission)}</p><div class="footnote">Responsable : ${esc(e.manager)}</div></div>`).join('')}</div>`}
function employees(){employeesPage()}
function tasks(){const q=queueItems();view.innerHTML=`<div class="section"><div><div class="eyebrow">FILE DE PRODUCTION</div><h2>Travaux automatiques</h2></div>${badge(q.length+' tâches','info')}</div><div class="card">${taskList(q)}</div>`}
function taskList(q){if(!q?.length)return `<div class="empty">Aucune tâche disponible dans l’état actuel.</div>`;return `<div class="list">${q.map(t=>`<div class="task"><div><strong>${esc(t.title||t.goal||t.type||'Tâche')}</strong><div><small>${esc(t.project||t.project_name||t.projectId||'CR3@TIX')} · ${esc(t.employee||t.assigned_employee_id||'EMP-001')}</small></div></div>${badge(t.status||'queued',t.status==='done'?'ok':t.status==='failed'?'err':'warn')}</div>`).join('')}</div>`}
function analysisList(a){if(!a.length)return `<div class="empty">Aucune analyse chargée.</div>`;return `<div class="list">${a.map(x=>`<div class="row"><div class="empavatar">${x.score>=50?'🟢':x.score>=35?'🟡':'🔵'}</div><div class="rowmain"><strong>${esc(x.project)}</strong><small>${esc((x.findings||[]).join(' · ')||'Analyse disponible')}</small></div>${badge((x.score??0)+'/100','info')}</div>`).join('')}</div>`}
function decisions(){view.innerHTML=`<div class="grid2"><div class="card glow"><div class="eyebrow">VALIDATION FINALE</div><h2>✅ File Boss</h2><p class="muted">Cette zone est destinée aux résultats terminés : publication, APK, correctif, livraison ou décision nécessitant ton approbation.</p><div class="empty">Aucune validation finale structurée n’est actuellement exposée par le cockpit.</div></div><div class="card"><h3>Règle d’autorité</h3><p class="muted">COMPANY peut analyser, préparer, déléguer, tester et recommencer automatiquement. La production finale reste sous contrôle du Boss.</p></div></div>`}
function system(){const st=s();view.innerHTML=`<div class="grid2"><div class="card"><div class="section"><h3>🛡️ COMPANY CORE</h3>${badge(core.error?'Dégradé':'Connecté',core.error?'warn':'ok')}</div><div class="list"><div class="row"><div class="empavatar">🗄️</div><div class="rowmain"><strong>Supabase CR3ATIX-COMPANY</strong><small>Mémoire centrale, tâches, événements et synchronisation.</small></div></div><div class="row"><div class="empavatar">⚙️</div><div class="rowmain"><strong>GitHub Actions</strong><small>Cycle automatique, tests et exécution des workers.</small></div></div><div class="row"><div class="empavatar">🧠</div><div class="rowmain"><strong>EMP-001</strong><small>Analyse automatique du portefeuille.</small></div></div></div></div><div class="card"><h3>État d’autonomie</h3><div class="legend">${badge(st.mode||'autonomous-supervised','ok')} ${badge('Cycle 6h','info')} ${badge('Boss final gate','warn')}</div><p class="muted" style="margin-top:14px">COMPANY sait aujourd’hui inventorier et analyser les projets, créer une file de travail et synchroniser son état. L’écriture autonome inter-dépôts et les livraisons complètes projet par projet restent la prochaine couche technique.</p>${core.error?`<div class="notice">Erreur de chargement : ${esc(core.error)}</div>`:''}</div></div>`}
function openOrder(){const m=$('#modal'),b=$('#modalbox');b.innerHTML=`<div class="section"><div><div class="eyebrow">ORDRE DU BOSS</div><h2>Donner une mission à COMPANY</h2></div><button class="btn" onclick="closeModal()">✕</button></div><p class="muted">Cette interface prépare ton ordre stratégique. La connexion directe au moteur d’exécution des ordres sera activée dans la prochaine couche.</p><div class="formgrid"><input id="orderProject" class="input" placeholder="Projet concerné (ex. NYXEL)"><textarea id="orderGoal" class="textarea" placeholder="Décris le résultat que tu veux obtenir…"></textarea><button class="btn primary" onclick="saveOrder()">📨 Préparer l’ordre</button></div>`;m.classList.remove('hidden')}
function saveOrder(){const p=$('#orderProject').value.trim(),g=$('#orderGoal').value.trim();if(!g)return;localStorage.setItem('cr3atix_company_pending_order',JSON.stringify({project:p,goal:g,createdAt:new Date().toISOString()}));$('#modalbox').innerHTML=`<h2>✅ Ordre enregistré dans le cockpit</h2><p class="muted">Projet : <strong>${esc(p||'Non précisé')}</strong></p><p>${esc(g)}</p><div class="notice">Il est conservé localement pour l’instant. Le branchement direct à EMP-001 doit encore être activé avant qu’il puisse déclencher automatiquement le travail.</div><div class="commandbar"><button class="btn" onclick="closeModal()">Fermer</button></div>`}
function closeModal(){$('#modal').classList.add('hidden')}function go(v){page=v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render()}
window.openOrder=openOrder;window.closeModal=closeModal;window.saveOrder=saveOrder;window.go=go;
</script>
</body>
</html>
