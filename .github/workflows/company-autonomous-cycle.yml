name: CR3@TIX COMPANY Autonomous Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: cr3atix-company-autonomous-cycle
  cancel-in-progress: false

jobs:
  company-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout COMPANY
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test COMPANY CORE
        run: node company-core/tests/core.test.mjs

      - name: EMP-001 — read CR3@TIX Project and analyze portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR3ATIX_OWNER: kevinlabens-del
        run: node company-core/autonomous-cycle.mjs

      - name: Sync COMPANY CORE to Supabase with GitHub OIDC
        env:
          COMPANY_SYNC_URL: https://lrtwopqymzaybiorewud.supabase.co/functions/v1/company-sync
        run: |
          OIDC_RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cr3atix-company")
          OIDC_TOKEN=$(node -e "const r=JSON.parse(process.argv[1]); if(!r.value) process.exit(2); process.stdout.write(r.value)" "$OIDC_RESPONSE")
          node -e "const fs=require('fs'); const registry=JSON.parse(fs.readFileSync('company-data/projects.json')); const queue=JSON.parse(fs.readFileSync('company-data/work-queue.json')); const state=JSON.parse(fs.readFileSync('company-data/company-state.json')); fs.writeFileSync('/tmp/company-sync.json',JSON.stringify({registry,queue,state}))"
          curl -fsS -X POST "$COMPANY_SYNC_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/company-sync.json
          echo

      - name: Persist generated company state
        run: |
          if git diff --quiet -- company-data/ && [ -z "$(git status --porcelain -- company-data/)" ]; then
            echo "No company-state change"
            exit 0
          fi
          git config user.name "CR3ATIX-COMPANY[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add company-data/
          git commit -m "chore(company): refresh autonomous project analysis"
          git push
